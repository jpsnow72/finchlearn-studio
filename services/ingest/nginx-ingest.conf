# Deployed at /etc/nginx/sites-available/ingest on the VPS (nginx owns
# 80/443 on that box, same as finch-render). Certbot manages the TLS
# block after `certbot --nginx -d ingest.finchlearn.com`.
server {
    listen 80;
    server_name ingest.finchlearn.com;
    client_max_body_size 16m;
    location / {
        proxy_pass http://127.0.0.1:8799;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}
