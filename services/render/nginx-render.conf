# Deployed at /etc/nginx/sites-available/render on the VPS (nginx owns
# 80/443 on that box; Caddy could not bind). Certbot manages the TLS
# block after `certbot --nginx -d render.finchlearn.com`.
server {
    listen 80;
    server_name render.finchlearn.com;
    client_max_body_size 1024m;
    location / {
        proxy_pass http://127.0.0.1:8797;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}
