# finch-generate is mounted on the EXISTING render.finchlearn.com vhost
# (no new hostname, no new cert). Add this location block to
# /etc/nginx/sites-available/render inside the 443 server block, next to
# the /matte-jobs location, then `nginx -t && systemctl reload nginx`.
#
# The editor build points VITE_FINCH_AI_ASSET_ENDPOINT at
# https://render.finchlearn.com/generate and POSTs there; generated
# images are served back from /generate/assets/<file>.
location /generate {
    proxy_pass http://127.0.0.1:8798;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_request_buffering off;
    proxy_read_timeout 180s;
}
